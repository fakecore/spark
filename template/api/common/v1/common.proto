syntax = "proto3";

package api.common;

option go_package = "spark/api/common/v1;v1";
option java_multiple_files = true;
option java_package = "api.common.v1";

// 分页信息
message PageInfo {
  // 当前页码
  int32 page = 1;
  // 每页记录数
  int32 page_size = 2;
  // 总记录数
  int64 total = 3;
  // 总页数
  int32 total_pages = 4;
}

// 分页查询参数
message PageParam {
  // 页码
  int32 page = 1;
  // 每页记录数
  int32 page_size = 2;
}

// 排序参数
message SortParam {
  // 排序字段
  string field = 1;
  // 是否升序排序
  bool ascending = 2;
}

// 通用查询请求
message QueryRequest {
  // 分页参数
  PageParam pagination = 1;
  // 排序参数
  repeated SortParam sort = 2;
  // 过滤条件
  map<string, string> filters = 3;
}