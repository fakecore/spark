syntax = "proto3";

package api.system.v1;

option go_package = "spark/api/system/v1;v1";
option java_multiple_files = true;
option java_package = "api.system.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

service Menu {
  // CreateMenu creates a new menu item in the system
  rpc CreateMenu(CreateMenuRequest) returns (CreateMenuReply) {
    option (google.api.http) = {
      post : "/api/v1/system/menu"
      body : "*"
    };
  }
  // UpdateMenu updates an existing menu item's attributes
  rpc UpdateMenu(UpdateMenuRequest) returns (UpdateMenuReply) {
    option (google.api.http) = {
      post : "/api/v1/system/menu/update"
      body : "*"
    };
  }
  // DeleteMenu deletes a menu item by its ID
  rpc DeleteMenu(DeleteMenuRequest) returns (DeleteMenuReply) {
    option (google.api.http) = {
      post : "/api/v1/system/menu/delete"
      body : "*"
    };
  }
  // GetMenu retrieves detailed information about a specific menu item
  rpc GetMenu(GetMenuRequest) returns (GetMenuReply) {
    option (google.api.http) = {
      get : "/api/v1/system/menu/get"
    };
  }
  // ListMenu retrieves a paginated list of menu items with optional filtering
  rpc ListMenu(ListMenuRequest) returns (ListMenuReply) {
    option (google.api.http) = {
      get : "/api/v1/system/menu/list"
    };
  }
  // ListAllMenu retrieves all menu items in the system as a tree structure
  rpc ListAllMenu(ListAllMenuRequest) returns (ListAllMenuReply) {
    option (google.api.http) = {
      get : "/api/v1/system/menu/all"
    };
  }

  // Added menu permission endpoints
  // CheckMenuPermission checks if a user has permission to perform an action on
  // a specific menu
  rpc CheckMenuPermission(CheckMenuPermissionRequest)
      returns (CheckMenuPermissionReply) {
    option (google.api.http) = {
      post : "/api/v1/system/menu/check"
      body : "*"
    };
  }
  // CheckMultiplePermissions checks multiple menu permissions for a user in a
  // single request
  rpc CheckMultiplePermissions(CheckMultiplePermissionsRequest)
      returns (CheckMultiplePermissionsReply) {
    option (google.api.http) = {
      post : "/api/v1/system/menu/check/multi"
      body : "*"
    };
  }
}

message MenuInfo {
  // ID
  int64 id = 1;
  // 父ID
  int64 pid = 2;
  // 规则名称
  string name = 3;
  // 规则名称
  string title = 4;
  // 图标
  string icon = 5;
  // 条件
  string condition = 6;
  // 备注
  optional string remark = 7;
  // 类型 0目录 1菜单 2按钮
  int32 menu_type = 8 [ (validate.rules).int32 = {in : [ 0, 1, 2 ]} ];
  // 权重
  int32 weight = 9;
  // 显示状态 0 隐藏 1 显示
  int32 is_show = 10 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 路由地址
  string path = 11;
  // 组件路径
  string component = 12;
  // 是否外链 1是 0否
  int32 is_link = 13 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 所属模块
  string module_type = 14;
  // 模型ID
  int32 model_id = 15;
  // 是否内嵌iframe
  int32 is_iframe = 16 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 是否缓存
  int32 is_cached = 17 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 路由重定向地址
  string redirect = 18;
  // 是否固定
  int32 is_affix = 19 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 链接地址
  string link_url = 20;
  // 创建者
  int64 created_by = 21;
  // 更新者
  int64 updated_by = 22;
  // 创建时间
  int64 created_at = 23;
  // 更新时间
  int64 updated_at = 24;
  // 子菜单
  repeated MenuInfo children = 25;
}

message CreateMenuRequest {
  // 父ID
  int64 pid = 1;
  // 规则名称
  string name = 2;
  // 规则名称
  string title = 3;
  // 图标
  string icon = 4;
  // 条件
  string condition = 5;
  // 备注
  optional string remark = 6;
  // 类型 0目录 1菜单 2按钮
  int32 menu_type = 7 [ (validate.rules).int32 = {in : [ 0, 1, 2 ]} ];
  // 权重
  int32 weight = 8;
  // 显示状态
  int32 is_show = 9 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 路由地址
  string path = 10;
  // 组件路径
  string component = 11;
  // 是否外链 1是 0否
  int32 is_link = 12 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 所属模块
  string module_type = 13;
  // 模型ID
  int32 model_id = 14;
  // 是否内嵌iframe
  int32 is_iframe = 15 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 是否缓存
  int32 is_cached = 16 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 路由重定向地址
  string redirect = 17;
  // 是否固定
  int32 is_affix = 18 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 链接地址
  string link_url = 19;
}

message CreateMenuReply {}

message UpdateMenuRequest {
  // 菜单ID
  int64 id = 1;
  // 规则名称
  optional string name = 2;
  // 规则名称
  optional string title = 3;
  // 图标
  optional string icon = 4;
  // 条件
  optional string condition = 5;
  // 备注
  optional string remark = 6;
  // 类型 0目录 1菜单 2按钮
  optional int32 menu_type = 7 [ (validate.rules).int32 = {in : [ 0, 1, 2 ]} ];
  // 权重
  optional int32 weight = 8;
  // 显示状态 0 隐藏 1 显示
  optional int32 is_show = 9 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 路由地址
  optional string path = 10;
  // 组件路径
  optional string component = 11;
  // 是否外链 1是 0否
  optional int32 is_link = 12 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 所属模块
  optional string module_type = 13;
  // 模型ID
  optional int32 model_id = 14;
  // 是否内嵌iframe
  optional int32 is_iframe = 15 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 是否缓存
  optional int32 is_cached = 16 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 路由重定向地址
  optional string redirect = 17;
  // 是否固定
  optional int32 is_affix = 18 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 链接地址
  optional string link_url = 19;
}

message UpdateMenuReply {}

message DeleteMenuRequest {
  // 菜单ID
  int64 id = 1;
}

message DeleteMenuReply {}

message GetMenuRequest {
  // 菜单ID
  int64 id = 1;
}

message GetMenuReply { MenuInfo menu = 1; }

message ListMenuRequest {
  // 当前页
  int32 current_page = 1;
  // 每页条数
  int32 page_size = 2;
  // 菜单名称，用于筛选
  optional string name = 3;
  // 状态筛选 0 隐藏 1 显示
  optional int32 is_show = 4 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
}

message ListMenuReply {
  // 菜单列表（树形结构）
  repeated MenuInfo items = 1;
  // 总条数
  int64 total = 2;
}

message ListAllMenuRequest {}

message ListAllMenuReply {
  // 菜单列表（树形结构）
  repeated MenuInfo items = 1;
}

// Added menu permission messages
message CheckMenuPermissionRequest {
  // 用户ID
  int64 user_id = 1;
  
  // 菜单ID
  int64 menu_id = 2;
  // 操作类型
  string action = 3;
}

message CheckMenuPermissionReply {
  // 是否有权限
  bool has_permission = 1;
}

message MenuActions {
  // 操作类型列表
  repeated string actions = 1;
}

message MenuPermission {
  // 菜单ID
  int64 menu_id = 1;
  // 操作类型
  string action = 2;
}

message CheckMultiplePermissionsRequest {
  // 用户ID
  int64 user_id = 1;
  
  // 权限列表
  repeated MenuPermission permissions = 2;
}

message CheckMultiplePermissionsReply {
  // 权限检查结果，key为菜单ID，value为是否有权限
  map<string, bool> results = 1;
}