syntax = "proto3";

package api.system.v1;

option go_package = "spark/api/system/v1;v1";
option java_multiple_files = true;
option java_package = "api.system.v1";

import "google/api/annotations.proto";
import "validate/validate.proto";

service Dept {
  rpc CreateDept(CreateDeptRequest) returns (CreateDeptReply) {
    option (google.api.http) = {
      post : "/api/v1/system/dept"
      body : "*"
    };
  }
  rpc UpdateDept(UpdateDeptRequest) returns (UpdateDeptReply) {
    option (google.api.http) = {
      post : "/api/v1/system/dept/update"
      body : "*"
    };
  }
  rpc DeleteDept(DeleteDeptRequest) returns (DeleteDeptReply) {
    option (google.api.http) = {
      post : "/api/v1/system/dept/delete"
      body : "*"
    };
  }
  rpc GetDept(GetDeptRequest) returns (GetDeptReply) {
    option (google.api.http) = {
      get : "/api/v1/system/dept/get"
    };
  }
  rpc ListDept(ListDeptRequest) returns (ListDeptReply) {
    option (google.api.http) = {
      get : "/api/v1/system/dept/list"
    };
  }
}

message DeptInfo {
  // 部门ID
  int64 id = 1;
  // 父部门ID
  int64 parent_id = 2;
  // 部门名称
  string dept_name = 3;
  // 显示顺序
  optional int32 sort = 4;
  // 负责人
  optional string leader = 5;
  // 联系电话
  optional string phone = 6;
  // 邮箱
  optional string email = 7;
  // 状态 0停用 1正常
  optional int32 status = 8;
  // 子部门
  repeated DeptInfo children = 9;
  // 创建时间
  int64 created_at = 10;
  // 更新时间
  int64 updated_at = 11;
  // 祖级列表
  optional string ancestors = 12;
}

message CreateDeptRequest {
  // 父部门ID
  int64 parent_id = 1;
  // 部门名称
  string dept_name = 2;
  // 显示顺序
  int32 sort = 3;
  // 负责人
  optional string leader = 4;
  // 联系电话
  optional string phone = 5;
  // 邮箱
  optional string email = 6;
  // 状态 0停用 1正常
  optional int32 status = 7;
}

message CreateDeptReply {}

message UpdateDeptRequest {
  // 部门ID
  int64 id = 1;
  // 部门名称
  optional string dept_name = 2;
  // 显示顺序
  optional int32 sort = 3;
  // 负责人
  optional string leader = 4;
  // 联系电话
  optional string phone = 5;
  // 邮箱
  optional string email = 6;
  // 状态 0停用 1正常
  optional int32 status = 7;
}

message UpdateDeptReply {}

message DeleteDeptRequest {
  // 部门ID
  int64 id = 1;
}

message DeleteDeptReply {}

message GetDeptRequest {
  // 部门ID
  int64 id = 1;
}

message GetDeptReply { DeptInfo dept = 1; }

message ListDeptRequest {
  // 每页数量
  int32 page_size = 1;
  // 页码
  int32 current = 2;
  // 部门名称，用于筛选
  optional string dept_name = 3;
  // 状态筛选 0停用 1正常
  optional int32 status = 4 [ (validate.rules).int32 = {in : [ 0, 1 ]} ];
  // 父部门ID，用于筛选
  optional int64 parent_id = 5;
}

message ListDeptReply {
  // 部门列表（树形结构）
  repeated DeptInfo items = 1;
  // 总数
  int32 total = 2;
}